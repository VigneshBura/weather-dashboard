<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    :root{
      --bg: #0b0d12;
      --card: #151a23;
      --text: #f1f3f7;
      --orange: #ff7a1a;
    }

    body{
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      padding: 24px;
    }

    .hero{
      background: linear-gradient(145deg,#ff7a1a,#c2410c);
      border-radius: 18px;
      padding: 20px;
      max-width: 320px;
      margin-top: 16px;
    }

    .hourly {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .hour {
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

    .daily {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .day {
     background: var(--card);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }

      .extra {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 16px;
      min-width: 120px;
    }

    .chart-box {                      
      background: var(--card);
      border-radius: 14px;
      padding: 12px;
      margin-top: 16px;
      max-width: 700px;
      height: 240px;
    }                                 

    .temp{
      font-size: 3.5rem;
      font-weight: 700;
    }

    input, button{
      border-radius: 10px;
      padding: 8px 14px;
    }

    button{
      background: var(--orange);
    }

        .dashboard {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      margin-top: 16px;
      align-items: start;
    }

    .right {
      min-width: 0;
    }

    .right > :first-child {
      margin-top: 0;
    }

    .hourly, .daily {
      overflow-x: auto;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .hero {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <h1>Weather Dashboard</h1>
  <input type="text" id="cityInput" placeholder="Search city">
  <button id="searchBtn">Search</button>
  <p id="status"></p>
  <div class="dashboard">
  <div class="hero">
    
    <h2 id="city">Mumbai</h2>
    <p class="temp" id="temp">32°C</p>
    <p id="desc">Partly Cloudy</p>
    <p id="humidity">Humidity: --</p>
    <p id="wind">Wind: --</p>
    
  </div>
  <div class="right">
  <div id="extra" class="extra"></div>
  <div id="hourly" class="hourly"></div>
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>
  <div id="daily" class="daily">
  </div>
  </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
  const WEATHER_CODES = {
  0: "Clear sky",
  1: "Mostly clear",
  2: "Partly cloudy",
  3: "Overcast",
  45: "Fog",
  61: "Light rain",
  63: "Rain",
  65: "Heavy rain",
  80: "Rain showers",
  95: "Thunderstorm",
  51: "Light drizzle",
  53: "Drizzle",
  55: "Heavy drizzle",
  71: "Light snow",
  73: "Snow",
  75: "Heavy snow",
  81: "Rain showers",
  82: "Violent rain showers",
  96: "Thunderstorm with hail",
  99: "Thunderstorm with heavy hail"
};

function showWeather(cityName, temperature, description, humidity, wind) {
  document.getElementById("city").textContent = cityName;
  document.getElementById("temp").textContent = temperature + "°C";
  document.getElementById("desc").textContent = description;
  document.getElementById("humidity").textContent = "Humidity: " + humidity + " %";
  document.getElementById("wind").textContent = "Wind: " + wind + " km/h";
}

function formatTime(iso) {
  let hours = Number(iso.slice(11, 13));
  const minutes = iso.slice(14, 16);
  const ampm = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;
  return hours + ":" + minutes + " " + ampm;
}

function showHourly(hourly, currentTime) {
  const start = hourly.time.findIndex(t => t > currentTime);

  const times = hourly.time.slice(start, start + 6);
  const temps = hourly.temperature_2m.slice(start, start + 6);

  const html = times.map((t, i) => `
    <div class="hour">
      <small>${formatTime(t)}</small>
      <p>${Math.round(temps[i])}°C</p>
    </div>
  `).join("");

  document.getElementById("hourly").innerHTML = html;
}

function showDaily(daily) {
  const html = daily.time.slice(1, 6).map((date, i) => {
    const dayName = new Date(date).toLocaleDateString("en-IN", { weekday: "short" });
    const max = Math.round(daily.temperature_2m_max[i + 1]);
    const min = Math.round(daily.temperature_2m_min[i + 1]);
    return `
      <div class="day">
        <small>${dayName}</small>
        <p>${max}° / ${min}°</p>
      </div>
    `;
  }).join("");

  document.getElementById("daily").innerHTML = html;
}

function showExtra(current, daily) {
  const cards = [
    ["Pressure", Math.round(current.surface_pressure) + " hPa"],
    ["Precipitation", current.precipitation + " mm"],
    ["UV index", Math.round(daily.uv_index_max[0])],
    ["Sunrise", formatTime(daily.sunrise[0])],
    ["Sunset", formatTime(daily.sunset[0])],
  ];

  const html = cards.map(([label, value]) => `
    <div class="stat">
      <small>${label}</small>
      <p>${value}</p>
    </div>
  `).join("");

  document.getElementById("extra").innerHTML = html;
}

let chart = null;                                                      // ← NAYA, yahan se

function showChart(hourly, currentTime) {
  const start = hourly.time.findIndex(t => t > currentTime);
  const labels = hourly.time.slice(start, start + 12).map(t => formatTime(t));
  const temps = hourly.temperature_2m.slice(start, start + 12);

  if (chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        data: temps,
        borderColor: "#ff7a1a",
        tension: 0.4
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: { legend: { display: false } }
    }
  });
} 

async function getWeather(cityName) {
  const statusEl = document.getElementById("status");
  try {
    statusEl.textContent = "Loading...";
  const geoURL = `https://geocoding-api.open-meteo.com/v1/search?name=${cityName}&count=1`;
  const geoRes = await fetch(geoURL);
  const geoData = await geoRes.json();
  if (!geoData.results) throw new Error("City not found");
  const place = geoData.results[0];

  const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m,surface_pressure,precipitation&hourly=temperature_2m&daily=temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset&timezone=auto`;
  const weatherRes = await fetch(weatherURL);
  const weatherData = await weatherRes.json();

  const temperature = weatherData.current.temperature_2m;
  const code = weatherData.current.weather_code;
  const humidity = weatherData.current.relative_humidity_2m;
  const wind = weatherData.current.wind_speed_10m;
  const description = WEATHER_CODES[code] || "Unknown";
  const fullName = place.name + (place.admin1 ? ", " + place.admin1 : "");

  showWeather(fullName, temperature, description, humidity, wind);
    showHourly(weatherData.hourly, weatherData.current.time);
    showDaily(weatherData.daily);
    showExtra(weatherData.current, weatherData.daily);
    showChart(weatherData.hourly, weatherData.current.time);
    statusEl.textContent = "";
  } catch (error) {
    statusEl.textContent = error.message;
  }
}

document.getElementById("searchBtn").addEventListener("click", function () {
  const name = document.getElementById("cityInput").value;
  getWeather(name);
});

document.getElementById("cityInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    const name = document.getElementById("cityInput").value;
    getWeather(name);
  }
});

getWeather("Mumbai");
</script>
</body>
</html>
